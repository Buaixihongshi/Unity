<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 756" width="1060" height="756" role="img" aria-labelledby="title-dark desc-dark">
  <title id="title-dark">Unity 系统架构图（深色版）</title>
  <desc id="desc-dark">Unity 本地多角色 AI 工作群架构（深色主题）：交互层、FastAPI 宿主编排内核、Provider Router 与统一 MCP 工具层、数据持久化，以及右侧旁路的回合观测与离线评测体系。</desc>
  <defs>
    <style>
      .sans { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
      .tier-label { font-size: 11.5px; font-weight: 800; letter-spacing: 0.4px; fill: #0d1117; }
      .tier-label-rail { font-size: 11.5px; font-weight: 800; letter-spacing: 0.4px; fill: #e6edf3; }
      .card-title { font-size: 14.5px; font-weight: 800; fill: #f0f6fc; }
      .card-sub { font-size: 11px; font-weight: 500; fill: #9ea7b3; }
      .card-code { font-size: 10.5px; font-weight: 600; fill: #c9d1d9; }
      .badge-text { font-size: 10px; font-weight: 700; letter-spacing: 0.3px; }
      .legend-text { font-size: 11.5px; font-weight: 600; fill: #c9d1d9; }
    </style>

    <pattern id="dot-grid-dark" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#232933" />
    </pattern>

    <marker id="arrow-ink-dark" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#e6edf3" />
    </marker>
    <marker id="arrow-sage-dark" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#8fc2b7" />
    </marker>
    <marker id="arrow-dashed-dark" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#8b949e" />
    </marker>
  </defs>

  <!-- Canvas -->
  <rect x="0" y="0" width="1060" height="756" rx="16" fill="#0d1117" />
  <rect x="0" y="0" width="1060" height="756" rx="16" fill="url(#dot-grid-dark)" opacity="0.9" />
  <rect x="1" y="1" width="1058" height="754" rx="15" fill="none" stroke="#30363d" stroke-width="1.5" />

  <!-- Header -->
  <g transform="translate(36, 20)">
    <rect x="2" y="2" width="38" height="38" rx="9" fill="#010409" />
    <rect x="0" y="0" width="38" height="38" rx="9" fill="#1c2128" stroke="#c9d1d9" stroke-width="1.8" />
    <path d="M 28 19 C 28 24 23 26 19 22 C 15 18 10 14 10 19 C 10 24 15 24 19 19 C 23 14 28 14 28 19 Z" fill="none" stroke="#0d1117" stroke-width="4.5" stroke-linejoin="round" />
    <path d="M 28 19 C 28 24 23 26 19 22 C 15 18 10 14 10 19 C 10 24 15 24 19 19 C 23 14 28 14 28 19 Z" fill="none" stroke="#8fc2b7" stroke-width="2.1" stroke-linejoin="round" />

    <text x="52" y="18" class="sans" font-size="18" font-weight="900" fill="#f0f6fc">Unity 系统架构</text>
    <text x="52" y="35" class="mono" font-size="10.5" font-weight="600" fill="#8b949e" letter-spacing="0.6">LOCAL-FIRST MULTI-AGENT WORKSPACE · CLIENT → HOST → ADAPTERS → STORAGE</text>

    <g transform="translate(596, 10)">
      <rect x="0" y="0" width="392" height="28" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.2" />
      <line x1="14" y1="14" x2="40" y2="14" stroke="#e6edf3" stroke-width="2" marker-end="url(#arrow-ink-dark)" />
      <text x="48" y="18" class="sans legend-text">主控制 / 数据流</text>

      <line x1="152" y1="14" x2="182" y2="14" stroke="#8fc2b7" stroke-width="2" marker-start="url(#arrow-sage-dark)" marker-end="url(#arrow-sage-dark)" />
      <text x="190" y="18" class="sans legend-text">双向读写 / 协同</text>

      <line x1="296" y1="14" x2="324" y2="14" stroke="#8b949e" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arrow-dashed-dark)" />
      <text x="332" y="18" class="sans legend-text">旁路观测</text>
    </g>
  </g>

  <!-- ==================== TIER 1: CLIENT ==================== -->
  <g id="tier-client-dark">
    <rect x="36" y="78" width="748" height="110" rx="10" fill="#16181d" stroke="#3b424d" stroke-width="1.5" />
    <rect x="52" y="67" width="128" height="22" rx="5" fill="#e0983c" stroke="#0d1117" stroke-width="1.5" />
    <text x="116" y="82" text-anchor="middle" class="sans tier-label">交互层 · CLIENT</text>

    <!-- UI Card -->
    <rect x="60" y="106" width="320" height="70" rx="8" fill="#010409" />
    <rect x="56" y="102" width="320" height="70" rx="8" fill="#1f242c" stroke="#8b949e" stroke-width="1.8" />
    <path d="M 57 109 Q 57 103 63 103 L 369 103 Q 375 103 375 109 Z" fill="#e0983c" />
    <text x="74" y="129" class="sans card-title">桌面 / 网页客户端</text>
    <text x="74" y="149" class="mono card-code">React + Vite · macOS MenuBar</text>

    <!-- Room Card -->
    <rect x="440" y="106" width="328" height="70" rx="8" fill="#010409" />
    <rect x="436" y="102" width="328" height="70" rx="8" fill="#1f242c" stroke="#8b949e" stroke-width="1.8" />
    <path d="M 437 109 Q 437 103 443 103 L 757 103 Q 763 103 763 109 Z" fill="#e0983c" />
    <text x="454" y="129" class="sans card-title">统一工作群</text>
    <text x="454" y="149" class="sans card-sub">@点名 · /discuss 讨论 · 任务协作</text>

    <!-- UI -> Room -->
    <line x1="378" y1="137" x2="430" y2="137" stroke="#e6edf3" stroke-width="2" marker-end="url(#arrow-ink-dark)" />
  </g>

  <!-- ==================== TIER 2: HOST ==================== -->
  <g id="tier-host-dark">
    <rect x="36" y="214" width="748" height="202" rx="10" fill="#141e1d" stroke="#42635d" stroke-width="1.5" />
    <rect x="52" y="203" width="212" height="22" rx="5" fill="#8fc2b7" stroke="#0d1117" stroke-width="1.5" />
    <text x="158" y="218" text-anchor="middle" class="sans tier-label">FastAPI 宿主编排内核 · HOST</text>

    <!-- A2A Card -->
    <rect x="60" y="242" width="320" height="74" rx="8" fill="#010409" />
    <rect x="56" y="238" width="320" height="74" rx="8" fill="#1f242c" stroke="#8b949e" stroke-width="1.8" />
    <path d="M 57 245 Q 57 239 63 239 L 369 239 Q 375 239 375 245 Z" fill="#8fc2b7" />
    <text x="74" y="264" class="sans card-title">A2A 协同协议</text>
    <text x="74" y="283" class="mono card-code">invoke_agent · 就近兑现</text>
    <text x="74" y="300" class="mono card-code">wait_reply · 调用链防环路</text>

    <!-- Orchestrator Card -->
    <rect x="440" y="242" width="328" height="74" rx="8" fill="#010409" />
    <rect x="436" y="238" width="328" height="74" rx="8" fill="#1f242c" stroke="#8b949e" stroke-width="1.8" />
    <path d="M 437 245 Q 437 239 443 239 L 757 239 Q 763 239 763 245 Z" fill="#8fc2b7" />
    <text x="454" y="264" class="sans card-title">任务与执行调度</text>
    <text x="454" y="283" class="mono card-code">MissionRunner · 自适应工作</text>
    <text x="454" y="300" class="sans card-sub">复杂度路由 · 子任务沉淀 · 非自审约束</text>

    <!-- Context Card -->
    <rect x="60" y="334" width="320" height="72" rx="8" fill="#010409" />
    <rect x="56" y="330" width="320" height="72" rx="8" fill="#1f242c" stroke="#8b949e" stroke-width="1.8" />
    <path d="M 57 337 Q 57 331 63 331 L 369 331 Q 375 331 375 337 Z" fill="#8fc2b7" />
    <text x="74" y="356" class="sans card-title">统一上下文装配</text>
    <text x="74" y="375" class="mono card-code">assembly.py · 分层预算裁剪</text>
    <text x="74" y="392" class="sans card-sub">模型交接 → 记忆 → 检查点 · 原文精确补读</text>

    <!-- Room -> Orchestrator -->
    <line x1="600" y1="174" x2="600" y2="232" stroke="#e6edf3" stroke-width="2" marker-end="url(#arrow-ink-dark)" />

    <!-- Orchestrator <-> A2A -->
    <line x1="382" y1="275" x2="430" y2="275" stroke="#8fc2b7" stroke-width="2" marker-start="url(#arrow-sage-dark)" marker-end="url(#arrow-sage-dark)" />

    <!-- Orchestrator -> Context -->
    <path d="M 456 314 L 456 366 L 382 366" fill="none" stroke="#e6edf3" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-ink-dark)" />
  </g>

  <!-- ==================== TIER 3: ADAPTERS ==================== -->
  <g id="tier-adapters-dark">
    <rect x="36" y="442" width="748" height="116" rx="10" fill="#141c27" stroke="#3c5470" stroke-width="1.5" />
    <rect x="52" y="431" width="246" height="22" rx="5" fill="#79b8ff" stroke="#0d1117" stroke-width="1.5" />
    <text x="175" y="446" text-anchor="middle" class="sans tier-label">Provider Router &amp; MCP · ADAPTERS</text>

    <!-- MCP Card -->
    <rect x="60" y="470" width="320" height="74" rx="8" fill="#010409" />
    <rect x="56" y="466" width="320" height="74" rx="8" fill="#1f242c" stroke="#8b949e" stroke-width="1.8" />
    <path d="M 57 473 Q 57 467 63 467 L 369 467 Q 375 467 375 473 Z" fill="#79b8ff" />
    <text x="74" y="492" class="sans card-title">Unity 统一 MCP 服务</text>
    <text x="74" y="511" class="mono card-code">read_context · write_artifact</text>
    <text x="74" y="528" class="mono card-code">save_checkpoint · memory · invoke_agent</text>

    <!-- Providers Card -->
    <rect x="440" y="470" width="328" height="74" rx="8" fill="#010409" />
    <rect x="436" y="466" width="328" height="74" rx="8" fill="#1f242c" stroke="#8b949e" stroke-width="1.8" />
    <path d="M 437 473 Q 437 467 443 467 L 757 467 Q 763 467 763 473 Z" fill="#79b8ff" />
    <text x="454" y="492" class="sans card-title">模型与 CLI 适配器</text>
    <text x="454" y="511" class="mono card-code">Codex CLI · Claude Code</text>
    <text x="454" y="528" class="mono card-code">Antigravity CLI · 自定义 API</text>

    <!-- Context -> MCP (placed at x=340 to clear pill cleanly) -->
    <line x1="340" y1="404" x2="340" y2="460" stroke="#e6edf3" stroke-width="2" marker-end="url(#arrow-ink-dark)" />

    <!-- Orchestrator -> Providers -->
    <line x1="600" y1="314" x2="600" y2="460" stroke="#e6edf3" stroke-width="2" marker-end="url(#arrow-ink-dark)" />

    <!-- MCP <-> Providers -->
    <line x1="382" y1="503" x2="430" y2="503" stroke="#8fc2b7" stroke-width="2" marker-start="url(#arrow-sage-dark)" marker-end="url(#arrow-sage-dark)" />
  </g>

  <!-- ==================== TIER 4: STORAGE ==================== -->
  <g id="tier-storage-dark">
    <rect x="36" y="584" width="748" height="120" rx="10" fill="#16181d" stroke="#3b424d" stroke-width="1.5" />
    <rect x="52" y="573" width="156" height="22" rx="5" fill="#c9d1d9" stroke="#0d1117" stroke-width="1.5" />
    <text x="130" y="588" text-anchor="middle" class="sans tier-label">数据持久化 · STORAGE</text>

    <!-- MemFile Card -->
    <rect x="60" y="612" width="216" height="78" rx="8" fill="#010409" />
    <rect x="56" y="608" width="216" height="78" rx="8" fill="#1f242c" stroke="#8b949e" stroke-width="1.8" />
    <path d="M 57 615 Q 57 609 63 609 L 265 609 Q 271 609 271 615 Z" fill="#c9d1d9" />
    <text x="72" y="634" class="sans card-title">角色长期记忆</text>
    <text x="72" y="653" class="sans card-sub">Markdown 文件为权威</text>
    <text x="72" y="670" class="mono card-code">YAML frontmatter 原子落盘</text>

    <!-- DB Card -->
    <rect x="300" y="612" width="228" height="78" rx="8" fill="#010409" />
    <rect x="296" y="608" width="228" height="78" rx="8" fill="#1f242c" stroke="#8b949e" stroke-width="1.8" />
    <path d="M 297 615 Q 297 609 303 609 L 517 609 Q 523 609 523 615 Z" fill="#c9d1d9" />
    <text x="312" y="634" class="sans card-title">SQLite 索引与会话状态</text>
    <text x="312" y="653" class="sans card-sub">记忆派生索引 · 短期检查点</text>
    <text x="312" y="670" class="sans card-sub">任务快照 · 观测事件流</text>

    <!-- Worktrees Card -->
    <rect x="552" y="612" width="216" height="78" rx="8" fill="#010409" />
    <rect x="548" y="608" width="216" height="78" rx="8" fill="#1f242c" stroke="#8b949e" stroke-width="1.8" />
    <path d="M 549 615 Q 549 609 555 609 L 757 609 Q 763 609 763 615 Z" fill="#c9d1d9" />
    <text x="564" y="634" class="sans card-title">独立任务工作树</text>
    <text x="564" y="653" class="mono card-code">task-worktrees/</text>
    <text x="564" y="670" class="sans card-sub">独立目录与 Git 分支隔离</text>

    <!-- MCP <-> MemFile (placed at x=242 to clear Storage pill) -->
    <line x1="242" y1="546" x2="242" y2="602" stroke="#8fc2b7" stroke-width="2" marker-start="url(#arrow-sage-dark)" marker-end="url(#arrow-sage-dark)" />

    <!-- MCP <-> DB -->
    <line x1="336" y1="546" x2="336" y2="602" stroke="#8fc2b7" stroke-width="2" marker-start="url(#arrow-sage-dark)" marker-end="url(#arrow-sage-dark)" />

    <!-- Providers -> Worktrees -->
    <line x1="656" y1="542" x2="656" y2="602" stroke="#e6edf3" stroke-width="2" marker-end="url(#arrow-ink-dark)" />
  </g>

  <!-- Cross-tier Orchestrator <-> DB (with clean halo bridge at y=503 crossing) -->
  <g id="orchestrator-db-bridge-dark">
    <path d="M 510 318 L 510 429 L 408 429 L 408 602" fill="none" stroke="#0d1117" stroke-width="7" stroke-linejoin="round" opacity="0.9" />
    <path d="M 510 318 L 510 429 L 408 429 L 408 602" fill="none" stroke="#8fc2b7" stroke-width="2" stroke-linejoin="round" marker-start="url(#arrow-sage-dark)" marker-end="url(#arrow-sage-dark)" />
    <line x1="382" y1="503" x2="430" y2="503" stroke="#141c27" stroke-width="6" />
    <line x1="382" y1="503" x2="430" y2="503" stroke="#8fc2b7" stroke-width="2" marker-start="url(#arrow-sage-dark)" marker-end="url(#arrow-sage-dark)" />
  </g>

  <!-- ==================== RIGHT RAIL: OBSERVABILITY & EVL ==================== -->
  <g id="right-rail-dark">
    <!-- Observability Panel -->
    <rect x="808" y="214" width="216" height="202" rx="10" fill="#161b22" stroke="#6e7681" stroke-width="1.5" stroke-dasharray="6 4" />
    <rect x="824" y="203" width="136" height="22" rx="5" fill="#21262d" stroke="#6e7681" stroke-width="1.5" />
    <text x="892" y="218" text-anchor="middle" class="sans tier-label-rail">观测旁路 · TRACE</text>

    <rect x="828" y="242" width="184" height="122" rx="8" fill="#010409" />
    <rect x="824" y="238" width="184" height="122" rx="8" fill="#1f242c" stroke="#8b949e" stroke-width="1.8" />
    <path d="M 825 245 Q 825 239 831 239 L 1001 239 Q 1007 239 1007 245 Z" fill="#8fc2b7" />
    <text x="838" y="264" class="sans card-title">回合观测与检查引擎</text>
    <text x="838" y="285" class="sans card-sub">纯函数读时计算 · 不落库</text>
    <text x="838" y="305" class="mono card-code">claims_match_events</text>
    <text x="838" y="324" class="sans card-sub">行为审计 · 跨会话覆盖率</text>
    <text x="838" y="343" class="sans card-sub">Token 成本与错误重试透视</text>

    <rect x="824" y="374" width="184" height="28" rx="6" fill="#142320" stroke="#355851" stroke-width="1" />
    <text x="916" y="392" text-anchor="middle" class="sans badge-text" fill="#8fc2b7">不侵入主链路 · 按回合聚合</text>

    <!-- Orchestrator -.-> ObservabilityEngine -->
    <line x1="766" y1="275" x2="818" y2="275" stroke="#8b949e" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-dashed-dark)" />

    <!-- EVL Panel -->
    <rect x="808" y="442" width="216" height="116" rx="10" fill="#161b22" stroke="#6e7681" stroke-width="1.5" stroke-dasharray="6 4" />
    <rect x="824" y="431" width="156" height="22" rx="5" fill="#21262d" stroke="#6e7681" stroke-width="1.5" />
    <text x="902" y="446" text-anchor="middle" class="sans tier-label-rail">离线可评测体系 · EVL</text>

    <rect x="828" y="470" width="184" height="74" rx="8" fill="#010409" />
    <rect x="824" y="466" width="184" height="74" rx="8" fill="#1f242c" stroke="#8b949e" stroke-width="1.8" />
    <path d="M 825 473 Q 825 467 831 467 L 1001 467 Q 1007 467 1007 473 Z" fill="#79b8ff" />
    <text x="838" y="492" class="sans card-title">A/B/C/D 配对对照评测</text>
    <text x="838" y="511" class="mono card-code">Single vs Multi-Agent</text>
    <text x="838" y="528" class="sans card-sub">PR Replay · Rubric 评分</text>

    <!-- EvalRunner -.-> Providers -->
    <line x1="822" y1="503" x2="770" y2="503" stroke="#8b949e" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-dashed-dark)" />
  </g>

  <!-- Footer -->
  <g transform="translate(36, 722)">
    <text x="0" y="14" class="sans" font-size="11" font-weight="600" fill="#8b949e">角色与模型解耦 · 文件为记忆权威 · 会话、记忆与工作树默认保留在本机</text>
    <text x="988" y="14" text-anchor="end" class="mono" font-size="10.5" font-weight="600" fill="#6e7681">github.com/Buaixihongshi/Unity</text>
  </g>
</svg>
