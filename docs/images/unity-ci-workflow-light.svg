<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 344" width="1060" height="344" role="img" aria-labelledby="title desc">
  <title id="title">Unity 开发、检查与发布协作流程（浅色版）</title>
  <desc id="desc">Unity 如何防止多个 AI 把主线改乱：独立目录开发、本地与云端共用检查清单、主线干净试跑，以及人工确认后再更新平时在用的版本。</desc>
  <defs>
    <style>
      .sans { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
      .tier-label { font-size: 11.5px; font-weight: 800; letter-spacing: 0.4px; fill: #fdfbf7; }
      .card-title { font-size: 14px; font-weight: 800; fill: #1a1a1a; }
      .card-sub { font-size: 11px; font-weight: 500; fill: #57534e; }
      .card-code { font-size: 10.5px; font-weight: 600; fill: #3f3b36; }
      .legend-text { font-size: 11.5px; font-weight: 600; fill: #44403c; }
      .edge-label { font-size: 10.5px; font-weight: 700; fill: #3f3b36; }
      .edge-warn { font-size: 10.5px; font-weight: 700; fill: #7a4c18; }
      .footer-note { font-size: 11px; font-weight: 600; fill: #355850; }
    </style>

    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#e2dacb" />
    </pattern>

    <marker id="arrow-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#1a1a1a" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#7a4c18" />
    </marker>
  </defs>

  <!-- Canvas -->
  <rect x="0" y="0" width="1060" height="344" rx="16" fill="#fdfbf7" />
  <rect x="0" y="0" width="1060" height="344" rx="16" fill="url(#dot-grid)" opacity="0.85" />
  <rect x="1" y="1" width="1058" height="342" rx="15" fill="none" stroke="#e3dbcd" stroke-width="1.5" />

  <!-- Header -->
  <g transform="translate(32, 20)">
    <rect x="2" y="2" width="38" height="38" rx="9" fill="#1a1a1a" />
    <rect x="0" y="0" width="38" height="38" rx="9" fill="#fdfbf7" stroke="#1a1a1a" stroke-width="2" />
    <path d="M 28 19 C 28 24 23 26 19 22 C 15 18 10 14 10 19 C 10 24 15 24 19 19 C 23 14 28 14 28 19 Z" fill="none" stroke="#1a1a1a" stroke-width="4.5" stroke-linejoin="round" />
    <path d="M 28 19 C 28 24 23 26 19 22 C 15 18 10 14 10 19 C 10 24 15 24 19 19 C 23 14 28 14 28 19 Z" fill="none" stroke="#7ba79d" stroke-width="2.1" stroke-linejoin="round" />

    <text x="52" y="18" class="sans" font-size="18" font-weight="900" fill="#1a1a1a">怎么协同改代码而不弄乱主线</text>
    <text x="52" y="35" class="mono" font-size="10.5" font-weight="600" fill="#6b665e" letter-spacing="0.4">ISOLATED WORKTREE · SHARED CHECKS · CLEAN ALPHA · MANUAL RELEASE</text>

    <g transform="translate(656, 8)">
      <rect x="0" y="0" width="340" height="28" rx="6" fill="#f5f1e8" stroke="#d5cdbd" stroke-width="1.2" />
      <line x1="14" y1="14" x2="40" y2="14" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arrow-ink)" />
      <text x="48" y="18" class="sans legend-text">主线推进</text>

      <line x1="122" y1="14" x2="148" y2="14" stroke="#7a4c18" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arrow-amber)" />
      <text x="156" y="18" class="sans legend-text">仅人工发布</text>

      <rect x="234" y="7" width="14" height="14" rx="3" fill="#eef4f2" stroke="#4e7a70" stroke-width="1.5" />
      <text x="255" y="18" class="sans legend-text">共用检查清单</text>
    </g>
  </g>

  <!-- Shared Check Base Container (Dev + CI) -->
  <g id="shared-gate">
    <rect x="32" y="96" width="468" height="214" rx="10" fill="#eef4f2" stroke="#1a1a1a" stroke-width="1.6" />
    <rect x="48" y="85" width="234" height="22" rx="5" fill="#4e7a70" stroke="#1a1a1a" stroke-width="1.5" />
    <text x="165" y="100" text-anchor="middle" class="sans tier-label">本地与云端共用同一套检查</text>

    <!-- Card 1: Worktree Dev -->
    <rect x="52" y="128" width="194" height="134" rx="8" fill="#1a1a1a" />
    <rect x="48" y="124" width="194" height="134" rx="8" fill="#ffffff" stroke="#1a1a1a" stroke-width="2" />
    <path d="M 49 131 Q 49 125 55 125 L 235 125 Q 241 125 241 131 Z" fill="#4e7a70" />
    <text x="64" y="152" class="sans card-title">1. 独立目录开发</text>
    <text x="64" y="176" class="mono card-code">codex/task-* 独立分支</text>
    <text x="64" y="198" class="sans card-sub">默认用真实 AI 隔离自验</text>
    <text x="64" y="218" class="sans card-sub">空闲 120 分钟自动回收</text>
    <text x="64" y="242" class="mono card-code">./scripts/env.sh dev</text>

    <!-- Arrow 1 -> 2 -->
    <text x="266" y="180" text-anchor="middle" class="mono edge-label">PR</text>
    <line x1="246" y1="191" x2="282" y2="191" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arrow-ink)" />

    <!-- Card 2: Dual CI -->
    <rect x="294" y="128" width="194" height="134" rx="8" fill="#1a1a1a" />
    <rect x="290" y="124" width="194" height="134" rx="8" fill="#ffffff" stroke="#1a1a1a" stroke-width="2" />
    <path d="M 291 131 Q 291 125 297 125 L 477 125 Q 483 125 483 131 Z" fill="#4e7a70" />
    <text x="306" y="152" class="sans card-title">2. 自动检查把关</text>
    <text x="306" y="176" class="sans card-sub">前后端并行 · 上限 10 分钟</text>
    <text x="306" y="198" class="sans card-sub">离线烟测 / 隐私 / 依赖审计</text>
    <text x="306" y="218" class="sans card-sub">有新提交自动取消旧检查</text>
    <text x="306" y="242" class="mono card-code">./scripts/check.sh</text>

    <!-- Footer inside shared gate -->
    <rect x="48" y="272" width="436" height="24" rx="5" fill="#e1ece9" stroke="#7ba79d" stroke-width="1.2" />
    <text x="266" y="288" text-anchor="middle" class="sans footer-note">本地与云端同源清单 · 检查前后比对提交号与代码指纹防混版</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <text x="524" y="180" text-anchor="middle" class="mono edge-label">合并</text>
  <line x1="488" y1="191" x2="544" y2="191" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arrow-ink)" />

  <!-- Card 3: alpha -->
  <g id="alpha-stage">
    <rect x="554" y="128" width="194" height="134" rx="8" fill="#1a1a1a" />
    <rect x="550" y="124" width="194" height="134" rx="8" fill="#ffffff" stroke="#1a1a1a" stroke-width="2" />
    <path d="M 551 131 Q 551 125 557 125 L 737 125 Q 743 125 743 131 Z" fill="#7a4c18" />
    <text x="566" y="152" class="sans card-title">3. 主线干净试跑</text>
    <text x="566" y="176" class="sans card-sub">只读同步最新主线代码</text>
    <text x="566" y="198" class="sans card-sub">合入后再用真实 AI 复验</text>
    <text x="566" y="218" class="sans card-sub">不碰平时在用的版本</text>
    <text x="566" y="242" class="mono card-code">./scripts/env.sh alpha</text>
  </g>

  <!-- Dashed Arrow 3 -.-> 4 -->
  <text x="786" y="178" text-anchor="middle" class="sans edge-warn">仅人工发布</text>
  <line x1="748" y1="191" x2="820" y2="191" stroke="#7a4c18" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-amber)" />

  <!-- Protected Runtime Zone -->
  <g id="runtime-zone">
    <rect x="826" y="96" width="202" height="214" rx="10" fill="#faf5ec" stroke="#7a4c18" stroke-width="1.6" stroke-dasharray="5 4" />
    <rect x="842" y="85" width="164" height="22" rx="5" fill="#7a4c18" stroke="#1a1a1a" stroke-width="1.5" />
    <text x="924" y="100" text-anchor="middle" class="sans tier-label">隔离保护 · 不自动覆盖</text>

    <rect x="844" y="128" width="170" height="134" rx="8" fill="#1a1a1a" />
    <rect x="840" y="124" width="170" height="134" rx="8" fill="#ffffff" stroke="#1a1a1a" stroke-width="2" />
    <path d="M 841 131 Q 841 125 847 125 L 1003 125 Q 1009 125 1009 131 Z" fill="#7a4c18" />
    <text x="856" y="152" class="sans card-title">平时在用的版本</text>
    <text x="856" y="176" class="sans card-sub">合入代码不自动重启</text>
    <text x="856" y="198" class="sans card-sub">核对检查与指纹证据</text>
    <text x="856" y="218" class="sans card-sub">支持一键切换与回退</text>
    <text x="856" y="242" class="mono card-code">./scripts/release.sh</text>

    <text x="927" y="288" text-anchor="middle" class="sans edge-warn">独立数据 · 空闲后人工切换</text>
  </g>
</svg>
