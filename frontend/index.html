<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Unity</title>
    <style>
      :root {
        --splash-bg: #fdfbf7;
        --splash-ink: #18191a;
        --splash-muted: #6e6b65;
        --splash-sage: #7ba79d;
        --splash-shadow: rgba(0, 0, 0, 0.12);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --splash-bg: #121314;
          --splash-ink: #f5f5f7;
          --splash-muted: #9ea0a5;
          --splash-sage: #8fc2b7;
          --splash-shadow: rgba(0, 0, 0, 0.45);
        }
      }
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background-color: var(--splash-bg);
      }
      #root {
        height: 100%;
      }
      #unity-splash-skeleton {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: var(--splash-bg);
        z-index: 9999;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      }
      .unity-splash-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 260px;
        animation: unitySplashBreathe 3.2s ease-in-out infinite 1.3s;
      }
      .unity-splash-svg {
        width: 160px;
        height: 160px;
        overflow: visible;
        color: var(--splash-ink);
      }
      /* 纯墨色单轨莫比乌斯环 */
      .unity-splash-mobius {
        fill: none;
        stroke: currentColor;
        stroke-width: 56px;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 1000;
        stroke-dashoffset: 1000;
        opacity: 0;
        animation: unitySplashDraw 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.28s;
      }
      /* 中宫凝墨原点（r=28 严丝合缝匹配 56px 墨锋线宽） */
      .unity-splash-dot {
        fill: currentColor;
        transform-origin: 256px 256px;
        opacity: 0;
        animation: unitySplashDotCondense 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards,
                   unitySplashDotFade 0.25s ease-out forwards 0.35s;
      }
      /* 闭合后显现的立体空间交叉盖层与微阴影 */
      .unity-splash-cap {
        fill: none;
        stroke: currentColor;
        stroke-width: 56px;
        stroke-linecap: round;
        stroke-linejoin: round;
        opacity: 0;
        animation: unitySplashFadeIn 0.35s ease-out forwards 1.18s;
      }
      .unity-splash-shadow {
        fill: none;
        stroke: var(--splash-shadow);
        stroke-width: 64px;
        stroke-linecap: round;
        filter: blur(4px);
        opacity: 0;
        animation: unitySplashFadeIn 0.35s ease-out forwards 1.18s;
      }
      /* 状态文本 */
      .unity-splash-status {
        margin-top: 24px;
        font-size: 14px;
        font-weight: 500;
        color: var(--splash-muted);
        letter-spacing: -0.1px;
        display: flex;
        align-items: center;
        gap: 8px;
        opacity: 0;
        animation: unitySplashFadeIn 0.4s ease-out forwards 0.1s;
      }
      .unity-splash-indicator {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background-color: var(--splash-sage);
        box-shadow: 0 0 6px var(--splash-sage);
      }
      @keyframes unitySplashDotCondense {
        0% { transform: scale(0); opacity: 0; }
        60% { transform: scale(1.15); opacity: 1; }
        100% { transform: scale(1); opacity: 1; }
      }
      @keyframes unitySplashDotFade {
        0% { opacity: 1; }
        100% { opacity: 0; }
      }
      @keyframes unitySplashDraw {
        0% { stroke-dashoffset: 1000; opacity: 1; }
        100% { stroke-dashoffset: 0; opacity: 1; }
      }
      @keyframes unitySplashFadeIn {
        0% { opacity: 0; }
        100% { opacity: 1; }
      }
      @keyframes unitySplashBreathe {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.02); }
      }
      /* 动效减弱偏好适配：即刻呈现静态完整 Logo，不闪烁不眩晕 */
      @media (prefers-reduced-motion: reduce) {
        .unity-splash-wrap {
          animation: none !important;
        }
        .unity-splash-mobius {
          stroke-dashoffset: 0 !important;
          opacity: 1 !important;
          animation: none !important;
        }
        .unity-splash-dot {
          display: none !important;
        }
        .unity-splash-cap,
        .unity-splash-shadow,
        .unity-splash-status {
          opacity: 1 !important;
          animation: none !important;
        }
      }
    </style>
  </head>
